<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>زيارات كبار العملاء</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b7686;--ac:#1f6feb;--ok:#1a7f4b;--wn:#b45309;--wb:#fff4e0;--bd:#dfe4ec}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--card:#192230;--tx:#e8edf5;--mu:#93a0b3;--ac:#5b9cff;--ok:#3ccf86;--wn:#f5a524;--wb:#3a2a10;--bd:#2a3648}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Arial;padding:12px 16px 40px}
h1{font-size:18px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer}.hd b{flex:1}.tag{font-size:12px;color:var(--mu)}
.done .hd{border-inline-start:4px solid var(--ok)}.warnb{background:var(--wb);color:var(--wn);padding:8px 12px;font-size:13px;border-top:1px solid var(--bd)}
.warnb label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.bd{padding:12px;border-top:1px solid var(--bd);display:none}.open .bd{display:block}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
select,input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}.row{display:flex;gap:8px;align-items:center}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.45}.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.ph{display:flex;gap:10px;align-items:center}.ph img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.msg{padding:10px;border-radius:8px;margin:8px 0;background:var(--wb);color:var(--wn);font-size:13px}.err{color:#d92d20}
h2{font-size:15px;margin:18px 0 4px;color:var(--mu)}
</style></head><body>
<h1 id="t">زيارات كبار العملاء</h1><div class="sub" id="s">…</div><div id="rs"></div><div id="m"></div><div id="l"></div><div id="x"></div>
<script>
(function(){
var API='https://numskybulgqlhyusttye.supabase.co/functions/v1/ka-page',TG=window.Telegram&&window.Telegram.WebApp;
try{if(TG){TG.ready();TG.expand();}}catch(e){}
var D=null,REP=null,ST={},$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function post(b){b.initData=TG&&TG.initData||'';if(REP)b.rep=REP;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function msg(t,e){$('m').innerHTML=t?'<div class="msg '+(e?'err':'')+'">'+esc(t)+'</div>':''}
var ERR={not_telegram:'افتح الصفحة من زر البوت داخل تلغرام.',not_ka:'هاد الحساب مو مسجّل كمندوب كبار عملاء.',photo_required:'لازم صورة رف قبل تسجيل الزيارة.',view_only:'عرض فقط.',server:'خطأ بالسيرفر، جرّب بعد شوي.'};
function load(){post({act:'load'}).then(function(j){if(!j.ok){msg(ERR[j.err]||j.err,1);$('s').textContent='';return}D=j;REP=j.rep;render()}).catch(function(){msg('ما في اتصال بالنت',1)})}
function card(it,kind){
  var k=kind+'|'+it.for_day+'|'+it.name,v=it.v,done=v&&v.status==='done',s=ST[k]||(ST[k]={}),h='';
  h+='<div class="card'+(done?' done':'')+(s.open?' open':'')+'" data-k="'+esc(k)+'"><div class="hd" data-a="tg"><b>'+(done?'✅ ':'')+esc(it.name)+'</b>'+(it.dayName?'<span class="tag">'+esc(it.dayName)+'</span>':'')+'<span class="tag">'+(done?'🕒 '+esc(v.vtime):'')+'</span></div>';
  (it.w||[]).forEach(function(w){h+='<div class="warnb">⚠️ <b>تنبيه من الإدارة</b> ('+esc(w.at)+'): '+esc(w.text)+(D.owner?'':'<label><input type="checkbox" data-a="fx" data-id="'+w.id+'"'+((s.fixed||{})[w.id]?' checked':'')+'> تم تصحيحها اليوم</label>')+'</div>'});
  h+='<div class="bd">';
  if(D.owner){
    if(done)h+='<div>الرف: '+esc(v.shelf)+' — '+(v.bought==='1'?'اشترى '+esc(v.amount):'ما اشترى')+'<br>'+esc(v.stock)+'<br>'+esc(v.note)+'</div>';
    h+='<label class="f">أضف تحذير للزيارة الجاية</label><input type="text" data-a="wt" placeholder="مثلاً: الرف مبعثر، رتّبو"><button class="btn sec" data-a="wa">⚠️ أرسل التحذير</button>';
  }else{
    h+='<label class="f">📸 صورة الرف (إلزامية)</label><div class="ph"><input type="file" accept="image/*" capture="environment" data-a="ph">'+(s.pv?'<img src="'+s.pv+'">':(done&&v.photo?'<span class="tag">✅ انبعتت صورة</span>':''))+'</div>';
    h+='<label class="f">حالة الرف</label><select data-a="sh"><option value="">اختر…</option>'+['ممتاز ومرتب','مقبول','مبعثر','ناقص أصناف','فاضي'].map(function(o){return '<option'+(((s.shelf!=null?s.shelf:(v&&v.shelf))===o)?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
    h+='<label class="f">المخزون / الأصناف الناقصة</label><textarea data-a="st">'+esc(s.stock!=null?s.stock:(v&&v.stock)||'')+'</textarea>';
    var bg=s.bought!=null?s.bought:(v&&v.bought);
    h+='<label class="f"><span class="row"><input type="checkbox" data-a="bg"'+(bg==='1'?' checked':'')+'> اشترى</span></label><input type="text" inputmode="decimal" data-a="am" placeholder="المبلغ (اختياري)" value="'+esc(s.amount!=null?s.amount:(v&&v.amount)||'')+'">';
    h+='<label class="f">ملاحظة</label><textarea data-a="nt">'+esc(s.note!=null?s.note:(v&&v.note)||'')+'</textarea>';
    h+='<button class="btn" data-a="sv"'+((s.photo||(v&&v.photo))?'':' disabled')+'>'+(done?'تحديث الزيارة':'✅ سجّل الزيارة')+'</button>';
  }
  return h+'</div></div>';
}
function render(){
  $('t').textContent='زيارات '+D.rep;$('s').textContent='يوم '+D.dayName+' · '+D.day;
  var rs='';if(D.owner&&D.reps&&D.reps.length>1)rs='<select id="rp">'+D.reps.map(function(r){return '<option'+(r===D.rep?' selected':'')+'>'+esc(r)+'</option>'}).join('')+'</select>';$('rs').innerHTML=rs;
  var n=D.list.filter(function(i){return i.v&&i.v.status==='done'}).length;
  $('l').innerHTML=(D.list.length?'<div class="sub">تمت '+n+' من '+D.list.length+'</div>':'<div class="msg">ما في زيارات مجدولة اليوم.</div>')+D.list.map(function(i){return card(i,'t')}).join('');
  $('x').innerHTML=D.missed.length?'<h2>🔁 ترميم أيام سابقة</h2>'+D.missed.map(function(i){return card(i,'m')}).join(''):'';
  var r=$('rp');if(r)r.onchange=function(){REP=r.value;load()};
}
function find(k){var p=k.split('|'),kind=p[0],f=p[1],nm=p.slice(2).join('|');return (kind==='t'?D.list:D.missed).filter(function(i){return i.name===nm&&i.for_day===f})[0]}
function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1280,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),cd=el.closest('.card'),k=cd&&cd.getAttribute('data-k'),s=k&&(ST[k]||(ST[k]={}));
  if(a==='tg'){s.open=!s.open;cd.classList.toggle('open',s.open)}
  if(a==='sv'){var it=find(k);el.disabled=true;el.textContent='عم ينحفظ…';
    var fixed=Object.keys(s.fixed||{}).filter(function(x){return s.fixed[x]}).map(Number);
    var sel=cd.querySelector('[data-a=sh]').value,st=cd.querySelector('[data-a=st]').value,bg=cd.querySelector('[data-a=bg]').checked?'1':'0',am=cd.querySelector('[data-a=am]').value,nt=cd.querySelector('[data-a=nt]').value;
    post({act:'visit',name:it.name,for_day:it.for_day,photo:s.photo||'',shelf:sel,stock:st,bought:bg,amount:am,note:nt,fixed:fixed}).then(function(j){
      if(j.ok){it.v=j.v;it.w=(it.w||[]).filter(function(w){return fixed.indexOf(w.id)<0});s.photo=null;s.pv=null;s.open=false;msg('✅ انسجّلت الزيارة');render()}else{msg(ERR[j.err]||j.err,1);render()}
    }).catch(function(){msg('ما في اتصال، جرّب مرة تانية',1);render()})}
  if(a==='wa'){var it2=find(k),t=cd.querySelector('[data-a=wt]').value.trim();if(!t)return;post({act:'warn',name:it2.name,text:t}).then(function(j){if(j.ok){it2.w=(it2.w||[]).concat([{id:j.id,text:t,at:D.day}]);s.open=false;msg('⚠️ انحفظ التحذير، بيظهر للمندوب بزيارة '+it2.name+' الجاية');render()}else msg(ERR[j.err]||j.err,1)})}
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),cd=el.closest('.card'),k=cd&&cd.getAttribute('data-k'),s=k&&(ST[k]||(ST[k]={}));
  if(a==='ph'&&el.files[0]){shrink(el.files[0],function(d){s.photo=d;s.pv=d;s.open=true;render()})}
  if(a==='fx'){(s.fixed=s.fixed||{})[el.getAttribute('data-id')]=el.checked}
});
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),cd=el.closest('.card'),k=cd&&cd.getAttribute('data-k'),s=k&&(ST[k]||(ST[k]={}));if(!s)return;
  if(a==='sh')s.shelf=el.value;if(a==='st')s.stock=el.value;if(a==='am')s.amount=el.value;if(a==='nt')s.note=el.value;if(a==='bg')s.bought=el.checked?'1':'0';
});
load();
})();
</script></body></html>
