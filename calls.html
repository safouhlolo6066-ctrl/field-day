<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>اتصالات المشرف — جينا</title>
<script>(function(){var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.async=true;window.__tgReady=new Promise(function(r){s.onload=r;s.onerror=r;setTimeout(r,4000);});document.head.appendChild(s);})();</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#6e6e73;--line:#d8d8dc;--ok:#2e7d32;--warn:#b26a00;--blue:#0a64d6}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989f;--line:#38383a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Tahoma,sans-serif;padding:12px 12px 120px}
h1{font-size:18px;margin:4px 0}.sub{color:var(--sub);font-size:13px;margin-bottom:10px}
.net{padding:8px 10px;border-radius:10px;font-size:13px;margin:8px 0}
.on{background:rgba(46,125,50,.12);color:var(--ok)}.off{background:rgba(178,106,0,.14);color:var(--warn)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.n{font-weight:700}.m{color:var(--sub);font-size:13px}
.m a{color:var(--blue);text-decoration:none}
.b{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.b button{padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.b button.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.r{font-size:12px;color:var(--ok);margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar button{width:100%;padding:13px;border-radius:12px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700}
.bar button:disabled{opacity:.5}
.bar .t{font-size:12px;color:var(--sub);text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<h1>📞 اتصالات المشرف</h1>
<div class="sub" id="sub"></div>
<div class="net" id="net"></div>
<div id="list"></div>
<div class="bar"><div class="t" id="st"></div><button id="send">📤 أرسل النتائج</button></div>
<script>
(function(){
var R={'1':'📵 مارد','2':'🟡 زار والصنف ضعيف','3':'🚩 زيارة وهمية','4':'⏰ أجّل الرد','5':'✅ رد — الزيارة صحيحة'};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dam(){var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Damascus',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),o={};p.forEach(function(x){o[x.type]=x.value;});return o;}
function nowTs(){var o=dam();return o.year+'-'+o.month+'-'+o.day+' '+o.hour+':'+o.minute;}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
var D=null,RES={};
try{var h=new URLSearchParams(location.hash.slice(1)).get('d');if(h){D=JSON.parse(b64d(h));localStorage.setItem('jc_last',JSON.stringify(D));}}catch(e){}
if(!D){try{D=JSON.parse(localStorage.getItem('jc_last')||'null');}catch(e){}}
if(!D||!D.items){document.body.innerHTML='<p style="padding:20px">⚠️ ما في قائمة اتصالات. افتح الصفحة من زر «📴 اتصالات بدون نت» بالبوت.</p>';return;}
var K='jc_res_'+D.day;try{RES=JSON.parse(localStorage.getItem(K)||'{}');}catch(e){RES={};}
function save(){try{localStorage.setItem(K,JSON.stringify(RES));}catch(e){}}
function net(){var on=navigator.onLine;$('net').className='net '+(on?'on':'off');$('net').textContent=on?'🟢 في نت — فيك تبعت النتائج':'📴 بدون نت — النتائج محفوظة على جوالك، ابعتها لما يرجع النت';}
function render(){
  $('sub').textContent=(D.dayTxt||D.day)+' · '+D.items.length+' اتصال';
  $('list').innerHTML=D.items.map(function(it){
    var r=RES[it.r];
    return '<div class="c"><div class="n">#'+it.r+' · '+esc(it.n)+'</div><div class="m">'+(it.p?'<a href="tel:'+esc(it.p)+'">☎️ '+esc(it.p)+'</a>':'')+(it.s?' · '+esc(it.s):'')+'</div>'
     +'<div class="b">'+Object.keys(R).map(function(k){return '<button data-r="'+it.r+'" data-k="'+k+'"'+(r&&r.k===k?' class="sel"':'')+'>'+R[k]+'</button>';}).join('')+'</div>'
     +(r?'<div class="r">'+R[r.k]+' · '+esc(r.ts)+(r.sent?' · ✔️ انبعتت':' · ⏳ لسا ما انبعتت')+'</div>':'')+'</div>';
  }).join('');
  var n=0,u=0;Object.keys(RES).forEach(function(k){n++;if(!RES[k].sent)u++;});
  $('st').textContent=n?(u+' نتيجة لسا ما انبعتت من '+n):'اختار نتيجة لكل اتصال';
  $('send').disabled=!n;
}
$('list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var r=b.getAttribute('data-r'),k=b.getAttribute('data-k');RES[r]={k:k,ts:nowTs(),sent:false};save();render();try{window.Telegram.WebApp.HapticFeedback.impactOccurred('light');}catch(x){}});
$('send').addEventListener('click',function(){
  if(!navigator.onLine){$('net').textContent='📴 ما في نت — النتائج محفوظة. ارجع اضغط «أرسل» لما يرجع النت.';return;}
  var TG=window.Telegram&&window.Telegram.WebApp;
  if(!TG||!TG.sendData){$('net').className='net off';$('net').textContent='⚠️ ما قدرت أتصل بتلغرام — افتح الصفحة من زر البوت وجرّب كمان مرة.';return;}
  var arr=Object.keys(RES).map(function(r){return [Number(r),RES[r].k,RES[r].ts];});
  Object.keys(RES).forEach(function(r){RES[r].sent=true;});save();
  TG.sendData(JSON.stringify({t:'sc',day:D.day,r:arr}));
});
window.addEventListener('online',net);window.addEventListener('offline',net);
try{window.__tgReady.then(function(){try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}});}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('calls-sw.js',{scope:'./calls.html'});}catch(e){}
net();render();
})();
</script>
</body>
</html>
