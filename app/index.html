<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>جينا الميداني</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#6c6c70;--line:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);
  --blue:#0060df;--green:#1b7f3a;--orange:#a85200;--red:#c42b1c;
  --r-lg:20px;--r-md:14px;--r-sm:10px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --chrome:rgba(242,242,247,.78);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989f;--line:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--blue:#4c9bff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--chrome:rgba(0,0,0,.72);--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:100%/1.5 system-ui,-apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif}
body{padding:0 var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;margin:0 calc(-1*var(--s4));padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
h1{font-size:2rem;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:800}
.sub{color:var(--sub);font-size:.9rem;margin-top:2px}
.card{background:var(--card);border-radius:var(--r-lg);padding:var(--s4);margin:var(--s3) 0;box-shadow:var(--sh)}
.card h2{font-size:1.05rem;margin:0 0 var(--s2);letter-spacing:-.01em}
.muted{color:var(--sub)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:600;background:var(--fill)}
.pill.ok{color:var(--green)}.pill.bad{color:var(--red)}.pill.wait{color:var(--orange)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
button,select,input{font:inherit;color:inherit}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:700;background:var(--fill);min-height:44px;cursor:pointer;transition:transform .1s ease-out,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:3px;margin:var(--s3) 0}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:.9rem;min-height:36px}
.seg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{display:block;overflow-wrap:anywhere}
.empty{color:var(--sub);text-align:center;padding:var(--s5) 0}
.skel{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--fill),transparent,var(--fill));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
label{display:block;font-size:.85rem;color:var(--sub);margin:var(--s3) 0 var(--s1)}
select,input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;min-height:44px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s4) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:auto}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto var(--s3)}
.msg{border-radius:var(--r-md);padding:var(--s3);background:var(--fill);font-size:.92rem}
.big{font-size:2.4rem;line-height:1}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg,.btn{transition:opacity .2s}.sheet{transform:none;opacity:0}.open .sheet{opacity:1}.skel{animation:none}}
@media (prefers-reduced-transparency:reduce){header{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}}
main{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<main>
<header><h1>جينا الميداني</h1><div class="sub" id="who">…</div></header>

<section class="card" aria-live="polite">
  <h2>الاتصال</h2>
  <div class="row" id="net"><span class="pill wait"><span class="dot"></span>عم نفحص…</span></div>
</section>

<section id="view" aria-live="polite"><div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div></div></section>
</main>

<div id="sheetwrap">
  <div class="sheet-bg" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="grab"></div>
    <h2 id="sh-title" style="margin:0 0 4px">موافقة</h2>
    <div class="muted" id="sh-who"></div>
    <label for="sh-role">الدور</label><select id="sh-role"></select>
    <label for="sh-region">المنطقة</label><input id="sh-region" placeholder="مثلاً: الجنوبية" maxlength="40">
    <label for="sh-sup">المشرف المسؤول عنو</label><select id="sh-sup"></select>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="sh-ok" style="flex:1">وافق</button><button class="btn" data-close>إلغاء</button></div>
    <div class="msg" id="sh-err" style="display:none;margin-top:12px"></div>
  </div>
</div>

<script>
(function () {
  var TG = window.Telegram && window.Telegram.WebApp; try { TG && TG.ready(); TG && TG.expand(); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var hap = function (k) { try { TG && TG.HapticFeedback && (k ? TG.HapticFeedback.notificationOccurred(k) : TG.HapticFeedback.impactOccurred('light')); } catch (e) {} };
  var ME = null, TAB = 'req', SUPS = [];
  var ERR = { bot_token_missing: 'السيرفر ناقصو توكن البوت — لازم صفوح يحطّو بإعدادات Supabase.', not_telegram: 'ما قدرنا نتأكد إنك من تلغرام. سكّر الصفحة وافتحها من زر البوت.', timeout: 'النت بطيء أو مقطوع — جرّب كمان شوي.' };

  // ── connectivity
  JD.ping().then(function (p) {
    $('net').innerHTML = p.ok ? '<span class="pill ok"><span class="dot"></span>السيرفر شغّال · ' + p.ms + ' ms</span>'
      : '<span class="pill bad"><span class="dot"></span>ما في اتصال بالسيرفر</span><span class="muted" style="font-size:.85rem">' + esc(p.err || '') + ' — جرّب بدون VPN ومع VPN وخبّرنا.</span>';
  });

  // ── start
  function boot() {
    JD.session().then(function (s) {
      if (s) return show();
      var init = TG && TG.initData;
      if (!init) return view('<div class="card"><h2>افتح من البوت</h2><p class="muted">تسجيل الدخول بيصير بكبسة من زر البوت بالتلغرام — بلا كلمة سر.</p><p class="muted">من المتصفّح فيك تشوف بس إذا الاتصال شغّال (فوق).</p></div>');
      view('<div class="card"><div class="skel"></div><div class="muted">عم نسجّل دخولك…</div></div>');
      JD.login(init).then(function (r) { if (r.ok) show(); else view('<div class="card"><h2>ما زبط الدخول</h2><p class="msg">' + esc(ERR[r.err] || ('خطأ: ' + r.err)) + '</p><button class="btn" onclick="location.reload()">جرّب مرة تانية</button></div>'); });
    });
  }
  function view(h) { $('view').innerHTML = h; }

  function show() {
    JD.me().then(function (me) {
      ME = me;
      if (!me) return view('<div class="card"><h2>ما لقينا حسابك</h2><p class="muted">افتح الصفحة من البوت مرة تانية.</p></div>');
      $('who').textContent = (me.name || 'بدون اسم') + ' · ' + (me.status === 'active' ? JD.ROLES[me.role] : (me.status === 'pending' ? 'بانتظار الموافقة' : 'موقوف'));
      if (me.status === 'pending') return view('<div class="card" style="text-align:center"><div class="big">⏳</div><h2 style="margin-top:12px">طلبك وصل</h2><p class="muted">مشرفك المختص لازم يوافق على حسابك ويحدّد دورك. أول ما يوافق بيوصلك خبر عالتلغرام.</p><p class="muted" style="font-size:.85rem">رقمك: ' + esc(me.tg_id) + '</p></div>');
      if (me.status === 'disabled') return view('<div class="card"><h2>حسابك موقوف</h2><p class="muted">راجع مشرفك.</p></div>');
      if (JD.SUP_ROLES.indexOf(me.role) < 0) return view('<div class="card"><h2>أهلين ' + esc(me.name) + '</h2><p class="muted">خطّك اليومي ولوحة أرقامك عم ننقلهن لهون — المرحلة الجاية.</p></div>');
      renderManager();
    });
  }

  // ── manager screens
  function renderManager() {
    var tabs = [['req', 'الطلبات'], ['team', 'الفريق']].concat(ME.role === 'admin' ? [['log', 'السجل']] : []);
    view('<div class="seg" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (TAB === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div><div id="pane" class="card"><div class="skel"></div><div class="skel" style="width:70%"></div></div>');
    loadPane();
  }
  function loadPane() {
    var p = $('pane'); if (!p) return;
    if (TAB === 'req') JD.pending().then(function (L) {
      p.innerHTML = '<h2>طلبات الانضمام</h2>' + (L.length ? '<ul class="list">' + L.map(function (x) { return '<li class="item"><div><b>' + esc(x.name || 'بدون اسم') + '</b><span class="muted" style="font-size:.85rem">' + (x.tg_username ? '@' + esc(x.tg_username) + ' · ' : '') + esc(x.tg_id) + '</span></div><button class="btn primary" data-approve="' + x.id + '" data-name="' + esc(x.name) + '">راجِع</button></li>'; }).join('') + '</ul>' : '<div class="empty">ما في طلبات جديدة ✓</div>');
    }).catch(fail);
    if (TAB === 'team') JD.members().then(function (L) {
      SUPS = L.filter(function (x) { return x.status === 'active' && JD.SUP_ROLES.indexOf(x.role) >= 0; });
      p.innerHTML = '<h2>الفريق (' + L.length + ')</h2>' + (L.length ? '<ul class="list">' + L.map(function (x) { return '<li class="item"><div><b>' + esc(x.name) + '</b><span class="muted" style="font-size:.85rem">' + esc(JD.ROLES[x.role]) + (x.region ? ' · ' + esc(x.region) : '') + '</span></div><span class="pill ' + (x.status === 'active' ? 'ok' : 'bad') + '"><span class="dot"></span>' + (x.status === 'active' ? 'فعّال' : 'موقوف') + '</span></li>'; }).join('') + '</ul>' : '<div class="empty">ما في أعضاء لسا.</div>');
    }).catch(fail);
    if (TAB === 'log') JD.audit().then(function (L) {
      var A = { approve: 'وافق على', status: 'غيّر حالة', access_request: 'طلب انضمام', admin_first_login: 'أول دخول أدمن' };
      p.innerHTML = '<h2>آخر العمليات</h2>' + (L.length ? '<ul class="list">' + L.map(function (x) { return '<li class="item"><div><b>' + esc(A[x.action] || x.action) + '</b><span class="muted" style="font-size:.85rem">' + new Date(x.at).toLocaleString('ar-SY', { timeZone: 'Asia/Damascus', dateStyle: 'short', timeStyle: 'short' }) + '</span></div></li>'; }).join('') + '</ul>' : '<div class="empty">ما في عمليات.</div>');
    }).catch(fail);
  }
  function fail(e) { var p = $('pane'); if (p) p.innerHTML = '<p class="msg">ما قدرنا نجيب البيانات — ' + esc(e && e.message || e) + '</p>'; }

  // ── approve sheet
  var target = null;
  function openSheet(id, name) {
    target = id; $('sh-who').textContent = name || '';
    var roles = Object.keys(JD.ROLES).filter(function (r) { return r !== 'admin' || ME.role === 'admin'; });
    $('sh-role').innerHTML = roles.map(function (r) { return '<option value="' + r + '">' + JD.ROLES[r] + '</option>'; }).join('');
    $('sh-region').value = ME.region || '';
    JD.members().then(function (L) {
      SUPS = L.filter(function (x) { return x.status === 'active' && JD.SUP_ROLES.indexOf(x.role) >= 0; });
      $('sh-sup').innerHTML = SUPS.map(function (s) { return '<option value="' + s.id + '"' + (s.id === ME.id ? ' selected' : '') + '>' + esc(s.name) + ' — ' + JD.ROLES[s.role] + '</option>'; }).join('');
    });
    $('sh-err').style.display = 'none'; document.getElementById('sheetwrap').className = 'open'; hap();
  }
  function closeSheet() { document.getElementById('sheetwrap').className = ''; }
  $('sh-ok').onclick = function () {
    var b = this; b.disabled = true;
    JD.approve(target, $('sh-role').value, $('sh-region').value, $('sh-sup').value).then(function () { hap('success'); closeSheet(); loadPane(); })
      .catch(function (e) { hap('error'); $('sh-err').textContent = 'ما زبط: ' + (e && e.message || e); $('sh-err').style.display = 'block'; })
      .then(function () { b.disabled = false; });
  };
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab],[data-approve],[data-close]'); if (!t) return;
    if (t.dataset.tab) { TAB = t.dataset.tab; hap(); renderManager(); }
    else if (t.dataset.approve) openSheet(t.dataset.approve, t.dataset.name);
    else closeSheet();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  boot();
})();
</script>
</body>
</html>
