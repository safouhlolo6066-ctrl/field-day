<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🧭 خط اليوم — جينا</title>
<link rel="manifest" href="manifest.json">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#ffffff;--ink:#1c1c1e;--sub:#6e6e73;--line:rgba(60,60,67,.12);--fill:rgba(118,118,128,.12);
--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--teal:#0a84ff;--chrome:rgba(249,249,251,.78);--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989f;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--chrome:rgba(28,28,30,.72);--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:100%/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:relative;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding:14px 16px 12px;border-bottom:.5px solid var(--line)}
h1{margin:0;font-size:1.65rem;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--sub);font-size:.85rem;margin-top:3px}
#sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#sum span{background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:var(--sh);font-size:.78rem;color:var(--sub)}
#sum b{display:block;font-size:1.35rem;line-height:1.15;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pb{height:6px;background:var(--fill);border-radius:3px;margin-top:10px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#30d158,#34c759);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.st2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;margin-top:9px;color:var(--sub)}
#net{border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--ink);font-weight:600;white-space:nowrap}#net.off{background:rgba(255,149,0,.18);color:#c46a00}#net.wait{background:rgba(0,122,255,.14);color:var(--blue)}
#loc button{font:inherit;font-size:.75rem;border:0;border-radius:999px;padding:3px 10px;margin-right:6px;background:var(--blue);color:#fff;font-weight:600}
#msg{display:none;margin:12px 16px 0;background:rgba(255,149,0,.14);color:#a35700;border-radius:14px;padding:12px 14px;font-size:.9rem;text-align:center;line-height:1.6}
#view{display:none;margin:12px 16px 0;background:rgba(0,122,255,.1);color:var(--blue);border-radius:14px;padding:10px 14px;font-size:.85rem;text-align:center;font-weight:600}
#adv{display:none;margin:12px 16px 0;background:var(--card);border-radius:16px;padding:12px 14px;font-size:.88rem;line-height:1.75;box-shadow:var(--sh)}
.seg{display:flex;margin:14px 16px 0;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.f{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font:inherit;font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s,box-shadow .2s}
.f.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sr{padding:10px 16px 0}#q{width:100%;padding:9px 12px;border:0;border-radius:10px;font:inherit;font-size:.95rem;background:var(--fill);color:var(--ink);outline:none}
#sortbar{display:none;position:sticky;top:110px;z-index:9;margin:10px 16px 0;background:var(--chrome);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;padding:10px 12px;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
#sortbar button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:.9rem}#sortok{background:var(--green);color:#fff}#sortno{background:var(--fill);color:var(--ink)}#sortmsg{flex-basis:100%;font-size:.8rem;color:var(--blue)}
#stick{position:sticky;top:0;z-index:9;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding:0 0 10px;border-bottom:.5px solid var(--line)}#stick .seg{margin-top:10px}
#list{padding:12px 16px 20px}
.c{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.c::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--fill)}
.c.vis::before{background:var(--blue)}.c.ok::before{background:var(--green)}.c.nb::before{background:var(--orange)}.c.nv::before{background:var(--red)}
.c.srt{display:flex;align-items:center;gap:8px;padding:10px 12px}.c.srt .nm{font-size:.95rem}.c.srt button{border:0;background:var(--fill);color:var(--ink);border-radius:10px;width:40px;height:38px;font-size:1rem}
.hd{display:flex;align-items:flex-start;gap:10px}.n{min-width:30px;height:30px;border-radius:15px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}.tt{flex:1;min-width:0}
.nm{font-weight:700;font-size:1.05rem;line-height:1.3;letter-spacing:-.01em}.mt{font-size:.8rem;color:var(--sub);margin-top:3px}.mt a{color:var(--blue);text-decoration:none}
.chips{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.tm{font-size:.72rem;font-weight:600;background:rgba(52,199,89,.14);color:#1f8a3b;border-radius:999px;padding:3px 9px;white-space:nowrap;text-decoration:none}.lc{background:rgba(0,122,255,.12);color:var(--blue)}.ofl{background:rgba(255,149,0,.16);color:#a35700}
.goal{font-size:.82rem;background:rgba(0,122,255,.07);color:var(--ink);border-radius:12px;padding:9px 11px;margin-top:10px;line-height:1.65}
.st{font-size:.76rem;color:var(--sub);margin-top:8px;line-height:1.5}
.dq{font-size:.8rem;background:rgba(255,149,0,.14);color:#a35700;border-radius:10px;padding:7px 10px;margin-top:9px}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:11px 6px;border-radius:12px;border:0;background:var(--fill);font:inherit;font-size:.92rem;font-weight:600;color:var(--ink);transition:transform .1s ease-out,background .2s,color .2s}
button:active{transform:scale(.97)}
.row button.on.g{background:var(--green);color:#fff}.row button.on.r{background:var(--red);color:#fff}.row button.on.a{background:var(--orange);color:#fff}
select,textarea{width:100%;margin-top:10px;padding:10px 12px;border:0;border-radius:12px;font:inherit;font-size:.9rem;background:var(--fill);color:var(--ink);resize:none;outline:none;-webkit-appearance:none;appearance:none}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}.sv{font-size:.75rem;color:var(--sub);min-height:14px}
.lk{border:0;background:none;color:var(--sub);font:inherit;font-size:.78rem;padding:4px 0}.lk.ph,.lk.gl{color:var(--blue);font-weight:600}
.emp{text-align:center;color:var(--sub);padding:40px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--line)}
nav button{flex:1;max-width:180px;border:0;border-radius:14px;padding:12px 8px;font:inherit;font-size:.85rem;font-weight:700;background:var(--fill);color:var(--ink)}nav #addbtn{background:var(--blue);color:#fff}
button:disabled,select:disabled,textarea:disabled{opacity:.45}
#sheetbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet h3{margin:0 0 10px;font-size:1.05rem;letter-spacing:-.01em}#sheet input{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:inherit;font-size:1rem;outline:none}
#sheet .acts{display:flex;gap:8px;margin-top:14px}#sheet .acts button{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:.95rem;background:var(--fill);color:var(--ink)}#sheet .acts .ok{background:var(--blue);color:#fff}#sheet .acts .ok.red{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
@media (prefers-reduced-transparency:reduce){header,nav,#sortbar{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<header>
  <h1 id="h1">🧭 خط اليوم</h1><div class="sub" id="sub">⏳ عم يحمّل…</div>
  <div id="sum"></div><div class="pb"><div id="bar"></div></div>
  <div class="st2"><span id="loc"></span><span id="net">…</span></div>
</header>
<div id="msg"></div>
<div id="view">👁 نسختك للمشاهدة بس — المندوب هو يلي بيسجّل.</div>
<div id="adv"></div>
<div id="sortbar"><button id="sortok">✅ احفظ الترتيب</button><button id="sortno">إلغاء</button><span id="sortmsg"></span></div>
<div id="stick"><div class="seg" role="tablist"><button class="f on" data-f="all">الكل</button><button class="f" data-f="left">الباقي</button><button class="f" data-f="vis">انزار</button><button class="f" data-f="nv">ما انزار</button></div>
<div class="sr"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="بحث — اسم، رقم عام، أو هاتف"></div></div>
<div id="list"></div>
<nav id="tools"><button id="advbtn" style="display:none">💡 النصيحة</button><button id="sortbtn">↕️ رتّب</button><button id="addbtn">＋ زبون جديد</button></nav>
<script>
(function () {
  'use strict';
  var API = '__API_URL__';
  var qs = new URLSearchParams(location.search), T = (qs.get('t') || '').replace(/[^a-z0-9]/g, ''), K = (qs.get('k') || '').replace(/[^A-Za-z0-9]/g, '');
  var TG = window.Telegram && window.Telegram.WebApp;
  try { if (TG) { TG.ready(); TG.expand(); if (TG.colorScheme === 'dark') document.documentElement.style.colorScheme = 'dark'; } } catch (e) {}
  var LS = 'jl_' + T;
  var DEMO = false, D = null, S = {}, Q = [], VIEW = false, filt = 'all', q = '', sorting = false, LOC = null, locState = '…', syncing = false;
  function $(id) { return document.getElementById(id); }
  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function norm(x) { return String(x || '').replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[\s\/\\*\-]+/g, ' ').toLowerCase().trim(); }
  function store() { try { localStorage.setItem(LS, JSON.stringify({ D: D, S: S, Q: Q, init: initData(), at: Date.now() })); } catch (e) {} }
  function restore() { try { var o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o && o.D) { D = o.D; S = o.S || {}; Q = o.Q || []; return o; } } catch (e) {} return null; }
  function initData() { var d = TG && TG.initData; if (d) return d; try { var o = JSON.parse(localStorage.getItem(LS) || 'null'); return (o && o.init) || ''; } catch (e) { return ''; } }
  function msg(t) { var m = $('msg'); m.innerHTML = t; m.style.display = t ? 'block' : 'none'; }
  function hm(ms) { return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // ── network
  function post(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }).then(function (r) { return r.json(); });
  }
  function net() {
    var e = $('net'); var n = Q.length;
    if (!navigator.onLine) { e.className = 'off'; e.textContent = '📴 أوفلاين' + (n ? ' · ' + n + ' بانتظار النت' : ''); }
    else if (n) { e.className = 'wait'; e.textContent = '⏳ ' + n + ' عم تنحفظ'; }
    else { e.className = ''; e.textContent = '☁️ كلو محفوظ'; }
  }
  function sync() {
    if (DEMO) { Q = []; net(); return; }
    if (syncing || !Q.length || !navigator.onLine || VIEW) { net(); return; }
    syncing = true; net();
    var batch = Q.slice(0, 200);
    post({ act: 'save', t: T, k: K, initData: initData(), deviceNow: Date.now(), ops: batch }).then(function (j) {
      syncing = false;
      if (j && j.ok) { var done = {}; (j.saved || []).forEach(function (id) { done[id] = 1; }); Q = Q.filter(function (o) { return !done[o.id]; }); store(); net(); if (Q.length) setTimeout(sync, 500); }
      else if (j && j.err === 'closed') { msg('🔒 انقفل خط اليوم وانسجّل بالملف — ما عاد فيك تعدّل.'); D.status = 'closed'; render(); }
      else { net(); setTimeout(sync, 15000); }
    }).catch(function () { syncing = false; net(); setTimeout(sync, 15000); });
  }
  window.addEventListener('online', function () { net(); sync(); });
  window.addEventListener('offline', net);
  setInterval(sync, 20000);

  // ── state
  function applyOp(o) {
    if (o.t === 'order') { if (o.rows && o.rows.length) D.order = o.rows; return; }
    var x = st(o.r); ['visited', 'bought', 'reason', 'note', 'phone', 'lat', 'lng', 'acc', 'kind', 'name', 'area', 'delreq', 'delreason'].forEach(function (k) { if (o[k] != null) x[k] = o[k]; });
    if (o.vt) x.vt = o.vt; else if (o.ats && o.visited === '1' && !x.vt) x.vt = hm(o.ats);
    if (o.off) x.off = 1;
  }
  function st(r) { if (!S[r]) S[r] = { r: r }; return S[r]; }
  function shops() {
    var base = (D.shops || []).map(function (s) { return { r: +s.r, g: s.g, n: s.n, p: s.p, s: s.s, t: s.t, a: s.a, pv: s.pv, ps: s.ps, sl: s.sl }; });
    Object.keys(S).forEach(function (k) { var x = S[k]; if (+k >= 1000 && x.kind === 'new') base.push({ r: +k, g: 'جديد', n: x.name + (x.area && String(x.name).indexOf(x.area) < 0 ? ' / ' + x.area : ''), p: x.phone || '', s: '🆕 زبون جديد — انضاف اليوم', isNew: 1 }); });
    var pos = {}; (D.order || []).forEach(function (r, i) { pos[r] = i; });
    var b0 = {}; base.forEach(function (s, i) { b0[s.r] = i; });
    base.sort(function (a, b) { return (pos[a.r] != null ? pos[a.r] : 1e5 + b0[a.r]) - (pos[b.r] != null ? pos[b.r] : 1e5 + b0[b.r]); });
    return base.filter(function (s) { var x = S[s.r] || {}; return x.kind !== 'newx' && x.delok !== 'ok'; });
  }
  function vis(s) { var x = S[s.r] || {}; return x.visited === '1' || (!x.visited && s.pv); }
  function buy(s) { var x = S[s.r] || {}; return vis(s) && (x.bought === '1' || (!x.bought && s.ps)); }

  // ── location (Telegram LocationManager → GPS) — works offline
  function setLoc(la, ln, ac) { LOC = { lat: (+la).toFixed(6), lng: (+ln).toFixed(6), acc: ac ? Math.round(ac) : '', at: Date.now() }; locState = '✓'; showLoc(); }
  function showLoc() { $('loc').innerHTML = '📍 الموقع: ' + (locState === '✓' ? 'شغّال ✓' : esc(locState) + ' <button id="locbtn">فعّل</button>'); }
  function gps(cb) { if (!navigator.geolocation) { locState = 'مو مدعوم'; showLoc(); if (cb) cb(); return; }
    navigator.geolocation.getCurrentPosition(function (p) { setLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy); if (cb) cb(); }, function () { locState = 'مو مسموح'; showLoc(); if (cb) cb(); }, { enableHighAccuracy: true, maximumAge: 60000, timeout: 15000 }); }
  function tgLoc(cb) { try { TG.LocationManager.getLocation(function (d) { if (d && d.latitude) setLoc(d.latitude, d.longitude, d.horizontal_accuracy); else { locState = 'مو مسموح'; showLoc(); } if (cb) cb(); }); } catch (e) { gps(cb); } }
  function refreshLoc(cb) { if (TG && TG.LocationManager && TG.LocationManager.isInited && TG.LocationManager.isLocationAvailable) tgLoc(cb); else gps(cb); }
  function initLoc() { try { if (TG && TG.LocationManager && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0')) { TG.LocationManager.init(function () { if (TG.LocationManager.isLocationAvailable) tgLoc(); else gps(); }); return; } } catch (e) {} gps(); }
  function fresh() { return LOC && Date.now() - LOC.at < 180000; }

  // ── ops
  function ask(title, fields, okLabel, cb, red) {
    var bg = document.createElement('div'); bg.id = 'sheetbg';
    bg.innerHTML = '<div id="sheet" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3>' + fields.map(function (f, i) { return '<input id="ask' + i + '" ' + (f.type ? 'type="' + f.type + '" inputmode="' + (f.type === 'tel' ? 'tel' : 'text') + '" ' : '') + 'placeholder="' + esc(f.ph || '') + '" value="' + esc(f.val || '') + '">'; }).join('') + '<div class="acts"><button class="no">إلغاء</button><button class="ok' + (red ? ' red' : '') + '">' + esc(okLabel || 'تم') + '</button></div></div>';
    document.body.appendChild(bg);
    var close = function () { bg.remove(); };
    bg.addEventListener('click', function (e) { if (e.target === bg || e.target.classList.contains('no')) close(); if (e.target.classList.contains('ok')) { var v = fields.map(function (f, i) { return document.getElementById('ask' + i).value.trim(); }); close(); cb(v); } });
    var first = document.getElementById('ask0'); if (first) setTimeout(function () { first.focus(); }, 60);
  }
  function hap(k) { try { if (TG && TG.HapticFeedback) { if (k === 'ok') TG.HapticFeedback.notificationOccurred('success'); else TG.HapticFeedback.impactOccurred('light'); } } catch (e) {} }
  function push(r, fields) {
    if (VIEW || D.status !== 'open') return;
    var x = st(r); var o = { id: rid(), ts: Date.now(), t: 'v', r: r };
    for (var k in fields) { o[k] = fields[k]; x[k] = fields[k]; }
    if (!navigator.onLine) { o.off = 1; x.off = 1; }
    Q.push(o); store(); net(); hap(fields.visited === '1' || fields.bought === '1' ? 'ok' : ''); setTimeout(sync, 1500);
  }
  function stampLoc(r, fields) { if (fresh()) { fields.lat = LOC.lat; fields.lng = LOC.lng; fields.acc = LOC.acc; } return fields; }

  // ── render
  function summary(L) {
    var n = L.length, v = 0, b = 0, nv = 0;
    L.forEach(function (s) { var x = S[s.r] || {}; if (vis(s)) v++; if (buy(s)) b++; if (x.visited === '0') nv++; });
    $('sum').innerHTML = '<span><b>' + v + '<small style="font-size:.6em;color:var(--sub)">/' + n + '</small></b>انزار</span><span><b>' + b + '</b>تم بيع</span><span><b>' + (n - v - nv) + '</b>باقي</span>';
    $('bar').style.width = (n ? Math.round(v * 100 / n) : 0) + '%';
  }
  function card(s, i) {
    var x = S[s.r] || {}, v = vis(s), b = buy(s), no = x.visited === '0', nb = v && x.bought === '0';
    if (sorting) return '<div class="c srt"><span class="n">' + (i + 1) + '</span><div class="tt nm">' + esc(s.n) + '</div><button data-m="top" data-r="' + s.r + '">⤒</button><button data-m="up" data-r="' + s.r + '">▲</button><button data-m="dn" data-r="' + s.r + '">▼</button></div>';
    var cls = v ? (b ? ' ok' : (nb ? ' nb' : ' vis')) : (no ? ' nv' : '');
    var ph = x.phone || s.p || '';
    var h = '<div class="c' + cls + '" id="c' + s.r + '"><div class="hd"><span class="n">' + (i + 1) + '</span><div class="tt"><div class="nm">' + esc(s.n) + '</div><div class="mt">'
      + (s.isNew ? '🆕 جديد' : 'رقم ' + esc(s.g || '—')) + (ph && !/^x+$/i.test(ph) ? ' · <a href="tel:' + esc(ph.split('/')[0].trim()) + '">☎ ' + esc(ph) + '</a>' : ' · ☎ —') + '</div></div><div class="chips">'
      + (v && (x.vt || s.pv) ? '<span class="tm' + (x.off ? ' ofl' : '') + '">🕒 ' + esc(x.vt || 'بالملف') + (x.off ? ' 📴' : '') + '</span>' : '')
      + (x.lat ? '<a class="tm lc" target="_blank" href="https://maps.google.com/?q=' + x.lat + ',' + x.lng + '">📍 الزيارة</a>' : (s.sl ? '<a class="tm lc" target="_blank" href="https://maps.google.com/?q=' + s.sl + '">📍 المحل</a>' : ''))
